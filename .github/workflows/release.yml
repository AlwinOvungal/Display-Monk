name: Release

# Builds the universal app and attaches DisplayMonk.dmg, DisplayMonk.zip and the displaymonk CLI to a GitHub release.
# Runs on its own when a release is published; use "Run workflow" to (re)attach the
# app to an existing release, e.g. v0.1.5.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the app to (for example v0.1.5)
        required: true
        default: v0.1.5

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  attach:
    name: Build and attach the app
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: swift --version
      - name: Bundle (release, universal)
        run: VERSION="${TAG#v}" scripts/bundle.sh
      - name: Check the bundle
        run: |
          plutil -extract CFBundleShortVersionString raw "build/Display Monk.app/Contents/Info.plist"
          lipo -archs "build/Display Monk.app/Contents/MacOS/DisplayMonk"
          hdiutil verify build/DisplayMonk.dmg
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/DisplayMonk.dmg build/DisplayMonk.zip build/displaymonk --clobber --repo "$GITHUB_REPOSITORY"
